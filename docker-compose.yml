name: gentlemans-club

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gc
      POSTGRES_PASSWORD: gc
      POSTGRES_DB: gentlemans_club
    ports:
      # Host-only: the local uvicorn/alembic need the database.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gc -d gentlemans_club"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://gc:gc@db:5432/gentlemans_club
    ports:
      # Host-only: the browser never talks to the API directly — the frontend
      # container proxies /api to api:8000 over the compose network.
      - "127.0.0.1:${API_PORT:-8080}:8000"
    volumes:
      # The uploaded service images outlive the container.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    environment:
      # Server-side proxy target, resolved by Docker DNS inside the network.
      # The browser never sees this — it calls the relative /api.
      API_PROXY_TARGET: http://api:8000
    volumes:
      # The host source hot-reloads through vite; the named volume keeps the
      # image's Linux node_modules from being shadowed by the host's Windows one
      # (platform specific binaries would otherwise break vite).
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
  uploads:
